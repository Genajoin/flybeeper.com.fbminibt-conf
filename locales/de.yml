update:
  how-to: Wie man aktualisiert
  eyebrow: Firmware-Update
  title-line1: Update direkt im Browser.
  title-line2: Ohne zusätzliche App.
  intro: 'Die Firmware wird direkt von dieser Seite installiert — über die bereits offene Bluetooth-Verbindung. Gerät verbinden, Firmware-Liste öffnen, „Aktualisieren" drücken. Das Image ist signiert, wird testweise installiert und automatisch zurückgerollt, wenn es nicht startet.'
  callout-eyebrow: Warum das sicher ist
  callout-body: 'Der Bootloader prüft die RSA-Signatur jedes Images — fremde Firmware startet gar nicht erst. Der neue Build wird im Testmodus installiert und bestätigt sich erst nach erfolgreichem Start: ein fehlgeschlagenes Update kehrt von selbst zur vorherigen Version zurück.'
  step-1-title: Gerät einschalten
  step-1-desc: Taste halten, bis die Melodie spielt. Gerät nahe am Telefon oder Laptop halten.
  step-2-title: Aus dieser App verbinden
  step-2-desc: „Verbinden" drücken und das Gerät im Browser-Dialog wählen. Kein Koppeln in den Systemeinstellungen nötig.
  step-3-title: Firmware-Liste öffnen
  step-3-desc: „Geräte" → dein Gerät → „Firmware", oder das Banner „Update verfügbar" in der Kopfzeile.
  step-4-title: „Aktualisieren" drücken
  step-4-desc: Der neueste veröffentlichte Build wird über die offene Verbindung übertragen. Der Fortschritt läuft in Prozent.
  step-5-title: Neustart abwarten
  step-5-desc: Die Übertragung dauert einige Zehn Sekunden, danach startet das Gerät neu und die App verbindet sich erneut, um zu prüfen, was gebootet ist.
  step-6-title: Version prüfen
  step-6-desc: In der Statuszeile erscheint die neue Firmware-Version — sobald das Gerät das Image bestätigt hat.
  fallback-eyebrow: Alternative — Safari unter iOS
  fallback-body: Safari unter iOS hat kein Web Bluetooth. Nutze den Browser Bluefy — dort funktioniert diese Seite wie gewohnt — oder lade die .bin herunter und installiere sie mit Nordics nRF Connect Device Manager.
  cta-ios: nRF · iOS ↗
  cta-android: nRF · Android ↗
  cta-firmware: Gerät aktualisieren →
  cta-download: .bin laden ↓
  page-title: 'Firmware-Update — {model}'
  archive-eyebrow: Alle Builds · Dateien
  archive-sub: Eine .bin wird nur für Safari unter iOS oder einen nativen MCUmgr-Client gebraucht. Das Update oben kommt ohne sie aus.
