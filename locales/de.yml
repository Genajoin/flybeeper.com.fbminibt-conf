about:
  p1: FlyBeeper - Geräte für Gleitschirme und Drachenflieger. Die Geräte verfügen über verschiedene Sensoren. Die verarbeiteten Daten werden über Bluetooth übertragen.
  p2: Diese Webanwendung kann eine Verbindung zum Gerät herstellen, dessen Einstellungen ändern und alle vom Gerät übertragenen Daten anzeigen. Hier können Sie die neueste Firmware-Version, den Änderungsverlauf und eine Beschreibung des Update-Vorgangs finden. Darüber hinaus können bei Erlaubnis die Daten der Satellitennavigation angezeigt werden.
  location-permission: Standortzugriff anfordern
  geo-granted: Standortzugriff gewährt
  geo-denied: Standortzugriff verweigert. Öffnen Sie die Browsereinstellungen, um Berechtigungen zu erteilen.
  p3: Die Anwendung kann offline installiert und verwendet werden.
  install-app: Anwendung installieren
  p4: Eine ausführliche Projektbeschreibung finden Sie auf der Projektseite.
  link-description: Projektseite
  link-market: FlyBeeper-Shop
  flag-eyebrow: ERWEITERT · DESKTOP CHROME
  flag-title: Sofortverbindung & Anwesenheit
  flag-body: 'Chrome kann anzeigen, welche deiner gespeicherten Geräte in der Nähe eingeschaltet sind, und sich selbst wieder verbinden — die Funktion steckt jedoch hinter einem experimentellen Flag. Einmal aktivieren:'
  flag-step1: Zum Kopieren klicken, in die Adressleiste einfügen und Enter drücken
  flag-copied: Kopiert — in die Adressleiste einfügen
  flag-step2: '"Experimental Web Platform features" auf Enabled setzen'
  flag-step3: Chrome neu starten, wenn dazu aufgefordert
  flag-note: Optional. Ohne das Flag funktioniert die Wiederverbindung weiterhin — du tippst das Gerät nur selbst an. Auf iOS-Browsern nicht verfügbar.
  alpisto-eyebrow: GEBAUT VON ALPISTO
  alpisto-title: Working code, not slide decks.
  alpisto-body: 'FlyBeeper-Hardware und -Firmware kommen von Alpisto — einer Ein-Personen-Ingenieurpraxis in Tolmin, Slowenien, geführt von Evgeny Istomin. Zwanzig Jahre nRF52-Firmware, BLE-Protokolle, KiCad-Platinen und Back-End-Arbeit — alles selbst gemacht. Kein Outsourcing, keine Folien.'
  alpisto-services: 'Embedded BLE (nRF52, Zephyr, ESP32) · IoT-Back-Ends (FastAPI, NATS, MQTT) · MATLAB → Python-Migrationen · technische Due Diligence.'
  alpisto-address: 'Rutarjeva ulica 15, 5220 Tolmin, Slowenien · USt-IdNr. SI91102227'
  alpisto-cta: alpisto.eu öffnen
  contact-eyebrow: KONTAKT
  contact-title: Nachricht senden
  contact-body: 'Fehlermeldungen, Hardware-Fragen, Kooperationsideen — schreib uns. Antwort innerhalb von zwei Werktagen.'
  contact-name: Name
  contact-name-ph: Optional
  contact-email: E-Mail
  contact-email-ph: 'du{''@''}beispiel.de'
  contact-message: Nachricht
  contact-message-ph: 'Worum geht''s?'
  contact-send: Senden
  contact-sending: Wird gesendet…
  contact-success-eyebrow: GESENDET
  contact-success-body: Danke — deine Nachricht ist angekommen. Du erhältst eine Antwort an die angegebene Adresse.
  contact-error-eyebrow: SENDEN FEHLGESCHLAGEN
  contact-error-body: 'Verbindung zum Formular-Endpoint nicht möglich. Prüfe deine Internetverbindung und versuche es erneut, oder schreibe direkt an hello{''@''}alpisto.eu.'
  fbtas-p1: Autonomer wahre Luftgeschwindigkeitssensor mit Bluetooth.
  fbminibt-p1: Variometer mit Bluetooth und drahtlosen Tasten. Hörbare Steigrate-Anzeige basierend auf benutzerdefinierten Kurven. Die Batterie ist kälteresistent.
  fbps-p1: Immer verfügbar für Bluetooth-Verbindung externer Barometer. Hohe Empfindlichkeit und Stabilität mit minimalen Verzögerungen. Verwandeln Sie jedes Smartphone in einen zuverlässigen Variometer. Diese Seite gilt für den FlyBeeper Baro und seinen Vorgänger Pressure Sensor (FBPS1) — sie teilen sich eine Firmware.
  fbrc4-p1: 4 externe Tasten sind immer für die Verbindung über Bluetooth verfügbar.
  fbfanet-p1: Externer Funksender mit Bluetooth-Steuerung zum Empfang von FANET-, ADS-L- oder ähnlichen Funkpaketen. Senden und empfangen Sie beliebige Daten ohne Internetverbindung.
  fbfv-p1: Externer FANET mit Bluetooth und Variometer in einem Gehäuse mit Solarpanel. Senden und Empfangen von FANET-Paketen ohne Internetverbindung. Verwenden Sie es als empfindliches Variometer und als Quelle für barometrische Höhenangaben für Smartphone-Apps.
  fbsv-p1: Ein kleines Variometer mit Bluetooth, Solarpanel und Superkondensator. Funktioniert von -25 bis +65 °C. 500k Lade-/Entladezyklen. 60 Sekunden USB Type C Aufladung bis 100% oder 15 Minuten Sonne zum Einschalten. Immer bereit mit einer "ewigen" Batterie.

