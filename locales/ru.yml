diag:
  battery-eyebrow: Батарея, в реальном времени
  battery-hint: 'Пока эта страница открыта и прибор подключён, она каждые {sec} с измеряет заряд батареи.'
  battery-waiting: Жду первый отсчёт батареи…
  battery-count: '{n} отсчётов'
  how-eyebrow: Как это работает
  how-body: 'Пока открыт конфигуратор, все ваши действия протоколируются — подключение, изменённые настройки, «Применить», симулятор, прослушивание звука, обновление прошивки — вместе с тем, что сообщает прибор, и тем, как меняется заряд. Чтобы показать нам проблему, не нужно расписывать каждый шаг: пользуйтесь конфигуратором как обычно, попробуйте воспроизвести проблему, а потом вернитесь на эту страницу и отправьте отчёт.'
  how-privacy: 'Протокол хранится только в этой вкладке браузера, в памяти — ничего не сохраняется на устройстве и никуда не отправляется, пока вы не нажмёте «Отправить», «Скачать» или «Скопировать». Перезагрузка или закрытие страницы начинает новый протокол.'
  logged: '{n} действий записано за эту сессию'
  offline-kept: 'Прибор сейчас не подключён. В отчёте сохранено то, что было прочитано с {name} раньше в этой сессии; подключите его снова, чтобы добавить свежие данные.'
