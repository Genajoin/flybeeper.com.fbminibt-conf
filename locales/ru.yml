  z-sink-body: 'Снижение сильнее {so} м/с — звук снижения есть всегда, откуда бы вы ни пришли.'
  z-sink-memory: Окно после снижения
  z-sink-memory-body: 'Звук есть, только если вы пришли сюда из снижения сильнее {so} м/с: тогда он держится, пока вариометр не поднимется до {sf} м/с. Если пришли сверху, здесь тишина. Если окно доходит до нуля, после снижения прибор продолжает пищать и в слабом нуле.'
  z-quiet: Тишина
  z-quiet-body: 'От {sf} до {cf} м/с прибор молчит. Здесь любой звук выключается, откуда бы вы ни пришли.'
  z-climb-memory: Удержание набора
  z-climb-memory-body: 'Звук набора продолжается, если вы пришли сверху (набор был сильнее {co} м/с), пока не опуститесь до {cf} м/с. Если пришли снизу — тишина: звук включится только выше {co} м/с.'
  z-climb-memory-hyst: 'Но если включён ранний выход ({early} м/с), он сильнее: когда набор слабеет, звук гаснет уже на {early} м/с, и удержание до {cf} м/с почти не работает. Удержание нужно с ранним выходом 0.'
  z-early: Ранний выход из потока
  z-early-body: 'Набор от {co} до {early} м/с. Пока набор растёт или держится, звук есть. Как только он начинает слабеть (варио ниже своего среднего), звук здесь гаснет — раньше, чем варио дойдёт до {co} м/с. Так компенсируется задержка усреднения: остановили набор — прибор замолчал сразу. Снова включится выше {early} м/с или когда набор перестанет слабеть.'
  z-climb: Звук набора
  z-climb-body: 'Набор сильнее {early} м/с — звук набора есть всегда.'
  hist-title: Последние 20 секунд
  hist-vario: 'варио (усреднение {s} с)'
  hist-ema: среднее для тренда (~0,4 с)
  hist-th: порог набора сейчас
  hist-tone: звук
  hist-weak: набор слабеет
  hist-empty: Подвигайте ползунок или запустите демо
  hist-caption: 'Как работает ранний выход: когда варио опускается ниже своего среднего за ~0,4 с (пунктир), набор считается слабеющим (полоска внизу), и порог набора (оранжевая линия) поднимается с {co} до {early} м/с — на {h}. Звук гаснет раньше, чем варио дойдёт до {co}, — это компенсирует задержку усреднения. Когда варио снова растёт, порог возвращается на {co}.'
  hist-caption-off: 'Ранний выход выключен (0): порог набора всегда {co} м/с, как бы быстро ни падал набор.'
trig:
  title: Когда звучит
  custom: Свой
  off: выкл
  summary: 'Набор {co} (держится до {cf}) · спуск {so} (держится до {sf}) · ранний выход {h} · усреднение {avg} с'
  custom-body: 'Значения не совпадают ни с одним пресетом — это ваша настройка. Выберите пресет, чтобы задать пороги, удержание, ранний выход и усреднение разом; кривые звука не меняются.'
  factory: Заводской
  factory-body: 'Как в новом приборе. Набор с +0,05, ранний выход 0,25 гасит звук, как только набор слабеет, снижение — сильнее −2,5. Быстрое усреднение.'
  sharp: Резкий
  sharp-body: 'Для активной центровки и соревнований. Минимум задержек: звук обрывается, как только набор начинает слабеть, ещё до нуля — сразу понятно, что вышли из ядра. Короткое усреднение, звук снижения раньше, с −2,0.'
  flatland: Равнина
  flatland-body: 'Слабые рваные потоки. Звук начинается с +0,05 и держится до −0,20, пока набор не пропадёт совсем, — слабое ядро не теряется и звук не дребезжит на пороге. Среднее усреднение.'
  mountain: Горы
  mountain-body: 'Сильные турбулентные потоки. Звук с +0,30, без ложных писков от болтанки; удержание до +0,10. Снижение — сильнее −3,0. Длинное усреднение: спокойнее, но с запаздыванием.'
  sniffer: Сниффер
  sniffer-body: 'Звук уже с −0,30: воздух поднимается, хотя медленнее, чем снижается крыло. Помогает найти слабый поток. Между −0,30 и нулём звучит особый низкий тон кривой — одинаково, откуда бы вы ни пришли.'
  always: Всегда звук
  always-body: 'Звук почти всегда. Набор звучит с 0 и держится до −0,30, снижение — с −0,60 и держится до −0,30. Тишина только на переходах: когда набор затухает — от −0,30 до −0,60, когда выходите из снижения — от −0,30 до 0.'
  quiet: Тихий
  quiet-body: 'Минимум звука: ридж, акро, новички. Набор с +0,30, снижение — только сильнее −4,0 (спираль).'
help:
  fcb14ed9-06e7-4a9e-b311-6eee676a2f48: 'Звук набора включается, когда варио выше этого значения. Ниже — тишина, если звук не удерживается (см. «Подъём: звук держится до»). Обычно +0,05…+0,20 м/с. Отрицательное значение делает прибор «сниффером»: он пищит и в слабом снижении.'
  1673f137-66c1-4ff0-8db3-69b9ed7c33e0: 'Удержание звука набора. Если звук набора уже звучит, он не выключается сразу ниже «Начала подъёма», а держится, пока варио не опустится до этого значения — чтобы слышать слабое ядро и не дребезжать на пороге. Работает, только если значение ниже «Начала подъёма»; равное или выше — удержания нет. Это противоположность «Раннему выходу по тренду»: тот гасит звук раньше, удержание — позже. Обычно выбирают одно: для удержания ставят ранний выход 0, иначе на спаде набора он сработает первым.'
  b713f438-42fe-46fe-b052-371a3b9e433a: 'Звук снижения включается, когда снижение сильнее этого значения, например −2,5 м/с. Между ним и «Началом подъёма» — тишина.'
  8a78979b-1425-4160-b34b-ac5aadddeb21: 'Удержание звука снижения. Если звук снижения уже звучит, он держится, пока варио не поднимется до этого значения. Работает, только если значение выше «Начала спуска»: при −2,5 и −1,8 звук снижения начинается на −2,5 и замолкает только на −1,8. При значении около нуля и выше после снижения прибор продолжает пищать и в слабом нуле — звук держится, пока набор не станет явным.'
  0e984fe9-534c-4f13-969c-58ce03d33527: 'Ранний выход из потока. Как только набор начинает слабеть (варио ниже своего среднего за ~0,4 с), порог звука набора поднимается на это значение, и звук гаснет раньше, чем варио дойдёт до «Начала подъёма». Это компенсирует задержки усреднения: остановили набор — прибор замолчал сразу. Когда набор снова растёт, порог возвращается. Пример: начало подъёма +0,05 и ранний выход 0,25 — на спаде звук смолкнет уже на +0,30, а включится, как обычно, выше +0,05. 0 — ранний выход выключен, тогда работает удержание «Подъём: звук держится до». Как это выглядит во времени — на графике «Последние 20 секунд» под симулятором.'
  e88b07e7-9035-4afa-9fe8-206ddc34de61: 'Вкл: писк меняет высоту прямо во время звучания, следом за варио. Выкл: каждый писк звучит одной частотой, взятой в его начале, и изменения слышны ступеньками от писка к писку.'
  7e035080-7417-4393-959a-58505ef9cf4a: 'Сглаживание показаний варио, в секундах. Больше — спокойнее, но с запаздыванием; меньше — быстрее и дёрганее. Действует на сами показания варио, по которым работает звук (заводское 0,1 с). Это не «среднее для тренда» (~0,4 с, фиксированное), по которому работает ранний выход: оно считается уже от сглаженного варио. Симулятор сглаживает ползунок так же — на графике «Последние 20 секунд» видно, как варио догоняет ползунок.'
  more: Подробнее
