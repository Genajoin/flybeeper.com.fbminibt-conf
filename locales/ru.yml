update:
  how-to: Как обновить
  eyebrow: Обновление прошивки
  title-line1: Обновление из браузера.
  title-line2: Без лишних приложений.
  intro: 'Прошивка ставится прямо с этой страницы — по тому Bluetooth-соединению, которое уже установлено. Подключите прибор, откройте список прошивок и нажмите «Обновить». Образ подписан, ставится в пробном режиме и откатывается сам, если не запустится.'
  callout-eyebrow: Почему это безопасно
  callout-body: 'Загрузчик проверяет RSA-подпись каждого образа — чужая прошивка просто не запустится. Новая сборка ставится в пробном режиме и подтверждает себя только после успешного старта: неудачное обновление откатывается на предыдущую версию само.'
  step-1-title: Включите прибор
  step-1-desc: Удерживайте кнопку до мелодии. Держите прибор рядом с телефоном или ноутбуком.
  step-2-title: Подключитесь из приложения
  step-2-desc: Нажмите «Подключить» и выберите прибор в окне браузера. Сопряжение в настройках системы не нужно.
  step-3-title: Откройте список прошивок
  step-3-desc: «Приборы» → ваш прибор → «Прошивка», либо баннер «доступно обновление» в шапке.
  step-4-title: Нажмите «Обновить»
  step-4-desc: Последняя опубликованная сборка зальётся по открытому соединению. Прогресс идёт в процентах.
  step-5-title: Дождитесь перезагрузки
  step-5-desc: Заливка занимает десятки секунд, затем прибор перезагрузится, а приложение переподключится и проверит, что именно загрузилось.
  step-6-title: Проверьте версию
  step-6-desc: В статус-баре появится новая версия прошивки — после того как прибор подтвердит образ.
  fallback-eyebrow: Запасной путь — Safari на iOS
  fallback-body: 'В Safari на iOS нет Web Bluetooth. Используйте браузер Bluefy — там эта страница работает как обычно, — либо скачайте .bin и залейте его через nRF Connect Device Manager от Nordic.'
  cta-ios: nRF · iOS ↗
