<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>404 — asset not found</title>
  </head>
  <body>
    <!--
  Served (with a real 404) for any /assets/* path that is not on disk. Kept
  deliberately tiny and free of markup the router could mistake for a page:
  its only job is to stop a missing bundle from being answered with a 200 +
  index.html. See public/_redirects for the full story.
-->
    <p>404 — asset not found. Reload the page to pick up the current build.</p>
  </body>
</html>
